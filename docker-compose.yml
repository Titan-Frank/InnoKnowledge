services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: okm
      POSTGRES_PASSWORD: okm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./storage/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okm -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10
