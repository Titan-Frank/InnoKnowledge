id: textbook/general
version: 2
name: 通用教材抽取模板
description: 适用于未明确归入具体学科的教材，遵循 world-v1.3 的知识对象、学科画像、课程投影和中文关系口径。
selector:
  subjects:
    - general
  book_id_patterns:
    - general
prompt:
  focus:
    - 抽取有明确教材证据支撑的概念、对象、属性、过程、方法、规则和表征。
    - 优先保留对后续学习有解释价值的知识对象。
  node_rules:
    - 节点名称使用教材中的规范术语，避免章节号、题号、栏目名成为节点。
    - definition 只写短定义，扩展解释放入 properties.semantic_core。
  edge_rules:
    - 只抽取证据能直接支持的关系。
    - 无法确定方向时使用 related_to，避免编造因果。
  evidence_rules:
    - evidence excerpt 保留最能支持节点或关系的一小段教材原文。
output:
  node_fields:
    - id
    - name
    - kind
    - subkind
    - definition
    - aliases
    - domains
    - knowledge_form
    - learning_mode
    - scope
    - properties.semantic_core
    - tags
  edge_fields:
    - from
    - to
    - type
    - directionality
    - confidence
    - evidence_anchor
    - notes
  evidence_fields:
    - anchor
    - excerpt
    - locator
    - modality
    - node_ids
  allowed_node_kinds:
    - entity
    - concept
    - property
    - process
    - event
    - method
    - rule
    - representation
    - resource
  preferred_edge_types:
    - is_a
    - instance_of
    - part_of
    - contains
    - has_property
    - uses
    - produces
    - depends_on
    - prerequisite_for
    - causes
    - affects
    - represents
    - formalizes
    - applies_to
    - analogous_to
    - models
    - about
    - related_to
identifiers:
  node_id: "{kind}:{normalized_name}"
  relation_id: "{from}:{type}:{to}"
  evidence_anchor: "ev{index}"
display:
  node_labels:
    concept: 概念
    entity: 实体
    property: 属性
    process: 过程
    method: 方法
    rule: 规则
    representation: 表征
  edge_labels:
    is_a: 是一种
    instance_of: 是实例
    part_of: 是组成部分
    contains: 包含
    has_property: 具有属性
    uses: 使用
    produces: 产生
    depends_on: 依赖
    prerequisite_for: 是前置知识
    causes: 导致
    affects: 影响
    represents: 表示
    formalizes: 形式化表达
    applies_to: 应用于
    analogous_to: 类似于
    models: 建模描述
    about: 主题是
    related_to: 相关
  colors:
    concept: "#8C55FF"
    entity: "#3782FF"
    property: "#FFB400"
    process: "#2BA876"
    method: "#1EB478"
    rule: "#5580CC"
    representation: "#6366F1"
